<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课伴AI｜英语课本智能学习助手</title>
  <meta name="description" content="课伴AI正式版英语学习平台" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <section id="authView" class="auth-view">
    <div class="auth-copy"><div class="logo"><b>伴</b> 课伴AI</div><div class="eyebrow">ENGLISH LEARNING SPACE</div><h1>让每一次英语学习，都有清晰的下一步。</h1><p>围绕课本完成预习、复习、作业反馈与学习记录，把每天的进步留下来。</p><div class="auth-points"><span>真实账号与安全会话</span><span>邮箱验证后开始学习</span><span>会员支付与订单可追踪</span></div></div>
    <div class="auth-panel">
      <div class="auth-tabs"><button class="active" data-auth-tab="login">登录</button><button data-auth-tab="register">注册</button></div>
      <form id="loginForm" data-form="login">
        <h2>欢迎回来</h2><p class="muted">继续你的英语学习计划</p>
        <label>用户名或邮箱<input name="username" autocomplete="username" required /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary full" type="submit">登录</button>
        <button class="text-button" type="button" data-action="forgot">忘记密码？</button>
        <div class="demo-note">开发默认管理员：查看 `production/.env.example`，首次启动会自动创建。</div>
      </form>
      <form id="registerForm" class="hidden" data-form="register">
        <h2>创建账号</h2><p class="muted">注册后验证邮箱即可开始学习</p>
        <label>用户名<input name="username" minlength="2" maxlength="20" required /></label>
        <label>邮箱<input name="email" type="email" autocomplete="email" required /></label>
        <label>密码<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button class="primary full" type="submit">注册并发送验证码</button>
      </form>
      <form id="verifyForm" class="hidden" data-form="verify">
        <h2>验证邮箱</h2><p class="muted">验证码已发送到 <strong id="verifyEmail"></strong></p>
        <input type="hidden" name="email" /><label>6位验证码<input name="code" inputmode="numeric" maxlength="6" required /></label>
        <button class="primary full" type="submit">验证并进入学习空间</button>
        <button class="text-button" type="button" data-action="resend">重新发送验证码</button>
      </form>
      <form id="resetRequestForm" class="hidden" data-form="reset-request">
        <h2>找回密码</h2><p class="muted">输入注册邮箱，我们会发送重置链接</p>
        <label>邮箱<input name="email" type="email" required /></label><button class="primary full" type="submit">发送重置邮件</button><button class="text-button" type="button" data-action="back-login">返回登录</button>
      </form>
      <form id="resetForm" class="hidden" data-form="reset">
        <h2>设置新密码</h2><p class="muted">重置链接有效期30分钟</p><input type="hidden" name="token" /><label>新密码<input name="password" type="password" minlength="8" required /></label><button class="primary full" type="submit">保存新密码</button>
      </form>
    </div>
  </section>

  <section id="appView" class="hidden">
    <header class="topbar"><a class="logo" href="#home"><b>伴</b> 课伴AI</a><nav id="nav"><a href="#home">首页</a><a href="#preview">课本预习</a><a href="#review">课本复习</a><a href="#homework">作业中心</a><a href="#membership">会员中心</a><a href="#admin" data-admin-only class="hidden">管理后台</a></nav><div class="user-area"><span id="userBadge"></span><button class="ghost" data-action="logout">退出</button></div></header>
    <main id="page"></main>
  </section>
  <script src="/app.js" type="module"></script>
</body>
</html>
