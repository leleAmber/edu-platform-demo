# 课伴AI 站点配置
#
# 安装：复制到 /etc/nginx/sites-available/keban，再软链到 sites-enabled/
#   sudo ln -sf /etc/nginx/sites-available/keban /etc/nginx/sites-enabled/keban
#   sudo nginx -t && sudo systemctl reload nginx
#
# 路由划分：
#   /      → Streamlit 网页版（8501，含 WebSocket）
#   /api/  → FastAPI 移动端后端（8000）
#   /h5/   → 移动端 H5 静态产物（npm run build:h5 生成）

server {
    listen 80;
    listen [::]:80;

    # 没有域名时保留 _（匹配任意 Host，用服务器 IP 即可访问）。
    # 有了域名后换成 server_name your-domain.com;
    server_name _;

    # 允许上传作业图片（作业拍照批改走 multipart 直传）
    client_max_body_size 20m;

    # ---------------------------------------------------------------- #
    # 移动端 H5：纯静态，没有后端进程
    # ---------------------------------------------------------------- #
    location /h5/ {
        alias /srv/edu-platform/mobile/dist/build/h5/;
        index index.html;
        # H5 用的是 hash 路由（#/pages/...），服务器只会被请求 index.html 与静态资源，
        # 兜底到 index.html 即可，不需要给每个子路径单独配。
        try_files $uri $uri/ /h5/index.html;
    }

    # ---------------------------------------------------------------- #
    # 移动端后端 API
    # ---------------------------------------------------------------- #
    location /api/ {
        # 结尾的 / 会把 /api/ 前缀剥掉：/api/auth/login → 后端收到 /auth/login
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 批改类接口是「提交拿 job_id → 轮询」，单次请求本身很快；
        # 但上传大图 + 大模型排队时仍可能超过默认 60s，放宽一些。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------- #
    # 网页版（Streamlit）—— 放最后，作为兜底 location
    # ---------------------------------------------------------------- #
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit 靠 WebSocket 推送界面更新，缺了这两行会一直转圈
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接不能被默认 60s 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
